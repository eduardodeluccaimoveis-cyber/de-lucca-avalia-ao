name: Compilar APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar servidor e sintaxe da interface
        run: |
          node --test server/server.test.mjs
          node --input-type=module -e "import fs from 'node:fs'; import vm from 'node:vm'; const h=fs.readFileSync('app/src/main/assets/index.html','utf8'); const s=h.match(/<script>([\\s\\S]*?)<\\/script>/); if(!s) throw Error('Script ausente'); new vm.Script(s[1]);"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Configurar ferramentas do SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Verificar SDK Android
        run: |
          command -v sdkmanager
          sdkmanager --version
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Compilar e verificar
        run: |
          gradle --no-daemon :app:assembleDebug
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk De-Lucca-Avaliacao-3.0-teste.apk
      - uses: actions/upload-artifact@v4
        with:
          name: De-Lucca-APK-teste
          path: De-Lucca-Avaliacao-3.0-teste.apk
      - name: Publicar APK 3.0 nos Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v3.0.0
          apk=De-Lucca-Avaliacao-3.0-teste.apk
          if gh release view "$tag" --json tagName >/dev/null 2>&1; then
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$apk"; then
              echo "APK desta versão já publicado; preservando a assinatura do arquivo original."
            else
              gh release upload "$tag" "$apk"
            fi
          else
            gh release create "$tag" "$apk" --target "$GITHUB_SHA" --title "De Lucca Avaliação Imobiliária PRO 3.0" --notes "APK Android de teste (assinatura debug). Pesquisa automática de anúncios via servidor configurado com APP_TOKEN. Faça backup das avaliações antes de atualizar; se as assinaturas forem diferentes, a instalação por cima poderá falhar. Não é necessário extrair ZIP." --prerelease
          fi
          gh release view "$tag" --json url,assets --jq '{url: .url, arquivos: [.assets[].name]}'
