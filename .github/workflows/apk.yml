name: Compilar APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Configurar ferramentas do SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Verificar SDK Android
        run: |
          command -v sdkmanager
          sdkmanager --version
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Compilar e verificar
        run: |
          gradle --no-daemon :app:assembleDebug
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk De-Lucca-Avaliacao-2.1-teste.apk
      - uses: actions/upload-artifact@v4
        with:
          name: De-Lucca-APK-teste
          path: De-Lucca-Avaliacao-2.1-teste.apk
