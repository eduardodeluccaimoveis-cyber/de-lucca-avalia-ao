<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>De Lucca | Teste da pesquisa</title>
<style>body{background:#f3f5f5;color:#142a3a;font:16px system-ui,sans-serif;margin:0}main{max-width:580px;margin:auto;padding:20px}h1{font-size:26px}section{background:white;border:1px solid #dde2e2;border-radius:14px;padding:18px;margin:14px 0}label{display:block;font-weight:600;margin:12px 0}input,select,button{font:inherit;box-sizing:border-box;width:100%;padding:12px;border:1px solid #adb9bf;border-radius:8px;margin:5px 0}button{background:#142a3a;color:white;font-weight:700}button:disabled{opacity:.5}p{line-height:1.5}a{color:#245b80;overflow-wrap:anywhere}.status{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#53636b}</style>
<main><h1>De Lucca | Teste da pesquisa</h1><p>Teste a comunicação com o servidor sem precisar atualizar o APK. O código de acesso não é salvo.</p>
<section><label>Código de acesso (APP_TOKEN)<input id="token" type="password" autocomplete="off"></label><small>Use o APP_TOKEN do Render, nunca a chave da OpenAI.</small><button id="check">Testar conexão (sem consumir créditos)</button><p id="status" class="status" role="status">Informe seu código de acesso.</p></section>
<section><h2>Teste com anúncios reais</h2><label>Cidade / UF<input id="city" value="Ribeirão Preto/SP"></label><label>Bairro<input id="district" value="Campos Elíseos"></label><label>Condomínio (opcional)<input id="condo"></label><label>Tipo<select id="type"><option>Apartamento</option><option>Casa</option><option>Casa em condomínio</option><option>Terreno</option><option>Sala comercial</option><option>Loja comercial</option><option>Outro</option></select></label><label>Finalidade<select id="purpose"><option value="venda">Venda</option><option value="locacao">Locação</option></select></label><label>Base de área<select id="basis"><option>Privativa</option><option>Construída</option><option>Terreno</option><option>Útil</option></select></label><label>Área em m²<input id="area" type="number" min="1" step="any" placeholder="Informe a área real"></label><button id="search">Pesquisar anúncios reais (usa créditos)</button><p id="researchStatus" class="status" role="status"></p><div id="results"></div></section>
<script>
const $=id=>document.getElementById(id);
async function call(path,query){
 const token=$('token').value.trim();if(token.length<24)throw Error('Informe o APP_TOKEN completo (mínimo de 24 caracteres).');
 const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(query),cache:'no-store',signal:AbortSignal.timeout(210000)});
 const data=await r.json();if(!r.ok)throw Error(data.error||('HTTP '+r.status));return data;
}
$('check').onclick=async()=>{const b=$('check');b.disabled=true;$('status').textContent='Verificando conexão e código de acesso…';try{await call('/check',{});$('status').textContent='Conexão OK. Código de acesso aceito. Nenhum crédito da OpenAI foi utilizado.';}catch(e){$('status').textContent='Falha: '+e.message;}finally{b.disabled=false;}};
$('search').onclick=async()=>{const q=Object.fromEntries(['city','district','condo','type','purpose','basis','area'].map(k=>[k,$(k).value.trim()]));if(!q.city||(!q.district&&!q.condo)||!(Number(q.area)>0)){$('researchStatus').textContent='Informe cidade, bairro ou condomínio e área.';return;}if(!confirm('Realizar uma pesquisa real que pode consumir créditos da API?'))return;const b=$('search');b.disabled=true;$('researchStatus').textContent='Consultando anúncios…';$('results').replaceChildren();try{const r=await call('/research',q);$('researchStatus').textContent=r.samples.length+' candidato(s). Confira os anúncios originais. '+(r.notes||'');for(const s of r.samples){const box=document.createElement('section');const title=document.createElement('strong');title.textContent=s.name;const p=document.createElement('p');p.textContent=s.location+' · '+s.area+' m² · '+Number(s.price).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const a=document.createElement('a');if(/^https:\/\//i.test(s.source)){a.href=s.source;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Ver anúncio original';}box.append(title,p,a);$('results').append(box);}}catch(e){$('researchStatus').textContent='Falha: '+e.message;}finally{b.disabled=false;}};
</script></main></html>
